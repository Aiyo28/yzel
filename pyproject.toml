[project]
name = "yzel"
version = "0.1.1"
description = "Unified MCP connectors for CIS business tools — 1C, Bitrix24, AmoCRM, Moysklad"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "Ayal Nogovitsyn", email = "hello@ayal.tech" },
]
keywords = ["mcp", "1c", "bitrix24", "amocrm", "moysklad", "ai", "integration"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]

dependencies = [
    "mcp>=1.0.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
    "cryptography>=42.0.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-httpx>=0.30.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
yzel = "yzel.cli:main"
# One console script per connector. Each is a standalone stdio MCP server, so an
# MCP client config can call it directly (`uvx --from yzel yzel-1c`) without a
# working directory, a clone, or a `python -m` invocation.
yzel-1c = "yzel.connectors.onec.server:run"
yzel-bitrix24 = "yzel.connectors.bitrix24.server:run"
yzel-amocrm = "yzel.connectors.amocrm.server:run"
yzel-moysklad = "yzel.connectors.moysklad.server:run"
yzel-wildberries = "yzel.connectors.wildberries.server:run"
yzel-ozon = "yzel.connectors.ozon.server:run"
yzel-telegram = "yzel.connectors.telegram.server:run"
yzel-iiko = "yzel.connectors.iiko.server:run"

[project.urls]
Homepage = "https://github.com/Aiyo28/yzel"
Documentation = "https://github.com/Aiyo28/yzel#readme"
Repository = "https://github.com/Aiyo28/yzel"
Issues = "https://github.com/Aiyo28/yzel/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/yzel"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.per-file-ignores]
# Mock servers reproduce real vendor payloads (1C OData $metadata XML, Ozon banners).
# Re-wrapping them would make the fixtures diverge from what the services actually send,
# which is the one property that makes a mock worth having.
"tests/mock_*_server.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
strict = true

[[tool.mypy.overrides]]
# The MCP SDK ships `@server.list_tools()` / `@server.call_tool()` without type
# annotations, so --strict flags every handler that uses them. Nothing here is
# fixable in this codebase. Scoping the relaxation to the server modules keeps
# strict mode enforced across the clients, the vault and schema discovery.
module = "yzel.connectors.*.server"
disallow_untyped_decorators = false
disallow_untyped_calls = false
